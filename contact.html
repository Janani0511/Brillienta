    <!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brillienta | Learn & Grow</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- 🌙 Dark Navbar -->
    <header class="p-3 text-bg-dark shadow-sm">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
          <a href="#" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
            <img src="assets/Brillienta.logo.png" alt="Logo" width="130" height="130" class="me-2 rounded-circle">
            <span class="fs-4 fw-bold text-warning">Brillienta</span>
          </a>

                   <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0 ms-4">
            <li><a href="index.html" class="nav-link px-2 text-secondary">Home</a></li>
            <li><a href="about.html" class="nav-link px-2 text-white">About</a></li>
            <li><a href="courses.html" class="nav-link px-2 text-white">Courses</a></li>
            <li><a href="#" class="nav-link px-2 text-white">Mentors</a></li>
            <li><a href="contact.html" class="nav-link px-2 text-white">Contact</a></li>
            <li><a href="#" class="nav-link px-2 text-white">FAQs</a></li>
          </ul>
          </div>
        </div>
      </div>
    </header>

    <!-- Navbar copied from index.html -->

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 form-card p-5">
          <h2 class="text-center text-success mb-4">Contact Us </h2>
          <p class="text-center text-muted mb-4">Have questions? Reach out to us — we’d love to hear from you!</p>
          
          <form>
            <div class="mb-3">
              <label for="name" class="form-label fw-bold">Full Name</label>
              <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label fw-bold">Email address</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
              <label for="message" class="form-label fw-bold">Message</label>
              <textarea class="form-control" id="message" rows="4" placeholder="Type your message here..." required></textarea>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success btn-lg">Send Message</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
